<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Qwen3-8B on Amazon EKS — architecture</title>
  <desc id="desc">Client calls an internet-facing ALB in public subnets, which forwards to the vLLM pod on a GPU node in private subnets. At startup the pod's init container gets temporary credentials through EKS Pod Identity, syncs model weights from S3 through an S3 Gateway endpoint, and writes them to an EBS gp3 volume that vLLM loads from.</desc>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d0d7de; --edge: #8c959f;
      --box: #ffffff; --g1: #f6f8fa; --g2: #eef1f4; --g3: #e6eaef;
      --req: #161616; --load: #0a7350; --ctl: #6e7781;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .t  { font-size: 13px; font-weight: 600; }
    .s  { font-size: 11px; fill: var(--muted); }
    .gl { font-size: 12px; font-weight: 600; }
    .gs { font-size: 11px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .cloud { fill: none; stroke: var(--edge); stroke-width: 1.25; }
    .vpc { fill: var(--g1); stroke: var(--edge); stroke-width: 1; }
    .net { fill: var(--g2); stroke: var(--line); }
    .eks { fill: var(--g1); stroke: var(--edge); }
    .ng  { fill: var(--g3); stroke: var(--line); }
    .pod { fill: var(--g2); stroke: var(--edge); stroke-dasharray: 4 3; }
    .box { fill: var(--box); stroke: var(--line); }
    .obj { fill: var(--box); stroke: var(--line); stroke-dasharray: 3 3; }
    .req  { fill: none; stroke: var(--req); stroke-width: 2; }
    .load { fill: none; stroke: var(--load); stroke-width: 1.75; stroke-dasharray: 6 4; }
    .ctl  { fill: none; stroke: var(--ctl); stroke-width: 1.25; stroke-dasharray: 2 3; }
    .ah-req { fill: var(--req); } .ah-load { fill: var(--load); } .ah-ctl { fill: var(--ctl); }
    .m-req { fill: var(--req); } .m-load { fill: var(--load); }
    .mt { font-size: 11px; font-weight: 700; fill: var(--bg); }
  </style>
  <defs>
    <marker id="a-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-req" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-load" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ctl" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="830"/>

  <!-- Client -->
  <rect class="box" x="30" y="330" width="135" height="70" rx="6"/>
  <text class="t" x="45" y="358">Client</text>
  <text class="s" x="45" y="376">curl · OpenAI SDK</text>

  <!-- AWS cloud -->
  <rect class="cloud" x="200" y="30" width="1050" height="740" rx="10"/>
  <text class="gl" x="215" y="52">AWS Cloud · us-east-1</text>

  <!-- VPC -->
  <rect class="vpc" x="230" y="70" width="770" height="670" rx="8"/>
  <text class="gl" x="245" y="92">VPC</text>

  <!-- Public subnets -->
  <rect class="net" x="255" y="105" width="695" height="110" rx="6"/>
  <text class="gl" x="270" y="124">Public subnets</text>
  <text class="gs mono" x="935" y="124" text-anchor="end">kubernetes.io/role/elb=1</text>

  <rect class="box" x="280" y="135" width="230" height="60" rx="6"/>
  <text class="t" x="295" y="160">Application Load Balancer</text>
  <text class="s" x="295" y="178">internet-facing · :80 / :443 (ACM)</text>

  <rect class="box" x="700" y="135" width="210" height="60" rx="6"/>
  <text class="t" x="715" y="160">NAT gateway</text>
  <text class="s" x="715" y="178">egress · container image pulls</text>

  <!-- Private subnets -->
  <rect class="net" x="255" y="240" width="695" height="475" rx="6"/>
  <text class="gl" x="270" y="258">Private subnets</text>

  <!-- EKS cluster -->
  <rect class="eks" x="275" y="275" width="655" height="420" rx="6"/>
  <text class="gl" x="290" y="294">EKS cluster  <tspan class="mono" font-weight="400">vllm-eks</tspan></text>

  <!-- System nodegroup -->
  <rect class="ng" x="295" y="310" width="220" height="140" rx="5"/>
  <text class="gl" x="310" y="328">system <tspan class="gs">· 2× m5.large</tspan></text>
  <rect class="box" x="305" y="345" width="200" height="55" rx="5"/>
  <text class="t" x="318" y="368">Load Balancer Controller</text>
  <text class="s" x="318" y="386">Helm · ns kube-system</text>
  <text class="s" x="310" y="432">CoreDNS · kube-proxy · VPC CNI</text>

  <!-- Ingress / Service objects -->
  <rect class="obj" x="295" y="480" width="220" height="55" rx="5"/>
  <text class="t" x="310" y="503">Ingress <tspan class="mono" font-weight="400">qwen3-8b</tspan></text>
  <text class="s mono" x="310" y="521">ingressClassName: alb</text>
  <rect class="obj" x="295" y="560" width="220" height="55" rx="5"/>
  <text class="t" x="310" y="583">Service <tspan class="mono" font-weight="400">qwen3-8b</tspan></text>
  <text class="s" x="310" y="601">ClusterIP · :80 → :8000</text>

  <!-- GPU nodegroup -->
  <rect class="ng" x="535" y="310" width="375" height="370" rx="5"/>
  <text class="gl" x="550" y="328">gpu <tspan class="gs">· g6e.xlarge · NVIDIA L40S 48 GB</tspan></text>
  <text class="gs mono" x="550" y="344">taint nvidia.com/gpu=true:NoSchedule</text>

  <rect class="box" x="555" y="362" width="335" height="48" rx="5"/>
  <text class="t" x="570" y="382">EKS Pod Identity Agent</text>
  <text class="s" x="570" y="399">DaemonSet · issues temporary AWS credentials</text>

  <!-- Pod -->
  <rect class="pod" x="555" y="425" width="335" height="170" rx="5"/>
  <text class="gl" x="570" y="443">Pod <tspan class="mono" font-weight="400">qwen3-8b</tspan> <tspan class="gs">· ns llm · SA vllm</tspan></text>

  <rect class="box" x="570" y="455" width="305" height="52" rx="5"/>
  <text class="t" x="583" y="476">initContainer  <tspan class="mono" font-weight="400">fetch-model</tspan></text>
  <text class="s mono" x="583" y="494">aws s3 sync → /models/qwen3-8b</text>

  <rect class="box" x="570" y="523" width="305" height="56" rx="5"/>
  <text class="t" x="583" y="546">vLLM OpenAI server  <tspan class="mono" font-weight="400">:8000</tspan></text>
  <text class="s mono" x="583" y="565">vllm-openai:v0.11.0 · max-model-len 32768</text>

  <!-- Volume + secret -->
  <rect class="box" x="555" y="610" width="170" height="55" rx="5"/>
  <text class="t" x="570" y="633">PVC <tspan class="mono" font-weight="400">model-cache</tspan></text>
  <text class="s" x="570" y="651">EBS gp3 · 50 Gi · /models</text>
  <rect class="obj" x="740" y="610" width="150" height="55" rx="5"/>
  <text class="t" x="755" y="633">Secret</text>
  <text class="s mono" x="755" y="651">VLLM_API_KEY</text>

  <!-- S3 gateway endpoint (on the VPC edge) -->
  <rect class="box" x="958" y="446" width="84" height="70" rx="5"/>
  <text class="t" x="1000" y="476" text-anchor="middle">S3 Gateway</text>
  <text class="s" x="1000" y="494" text-anchor="middle">endpoint</text>

  <!-- Regional services -->
  <rect class="box" x="1075" y="250" width="160" height="80" rx="6"/>
  <text class="t" x="1090" y="273">IAM role</text>
  <text class="s mono" x="1090" y="291">vllm-s3-model-read</text>
  <text class="s" x="1090" y="309">Pod Identity → llm/vllm</text>

  <rect class="box" x="1075" y="441" width="160" height="80" rx="6"/>
  <text class="t" x="1090" y="464">Amazon S3</text>
  <text class="s mono" x="1090" y="482">models/qwen3-8b/</text>
  <text class="s" x="1090" y="500">safetensors · tokenizer</text>

  <!-- Control / config (dotted grey) -->
  <path class="ctl" d="M490,480 V401" marker-end="url(#a-ctl)"/>
  <path class="ctl" d="M470,345 V196" marker-end="url(#a-ctl)"/>
  <path class="ctl" d="M405,535 V559" marker-end="url(#a-ctl)"/>
  <path class="ctl" d="M815,610 V580" marker-end="url(#a-ctl)"/>

  <!-- Model load at startup (dashed orange) -->
  <path class="load" d="M1075,290 H940 V386 H891" marker-end="url(#a-load)"/>
  <path class="load" d="M860,410 V454" marker-end="url(#a-load)"/>
  <path class="load" d="M875,481 H957" marker-end="url(#a-load)"/>
  <path class="load" d="M1042,481 H1074" marker-end="url(#a-load)"/>
  <path class="load" d="M570,481 H545 V637 H554" marker-end="url(#a-load)"/>
  <path class="load" d="M640,610 V580" marker-end="url(#a-load)"/>

  <!-- Request path (solid blue) -->
  <path class="req" d="M165,365 H220 V165 H279" marker-end="url(#a-req)"/>
  <path class="req" d="M510,165 H525 V551 H569" marker-end="url(#a-req)"/>

  <!-- Step markers -->
  <g>
    <circle class="m-req" cx="220" cy="265" r="9"/><text class="mt" x="220" y="269" text-anchor="middle">1</text>
    <circle class="m-req" cx="525" cy="258" r="9"/><text class="mt" x="525" y="262" text-anchor="middle">2</text>
    <circle class="m-load" cx="1040" cy="290" r="9"/><text class="mt" x="1040" y="294" text-anchor="middle">A</text>
    <circle class="m-load" cx="860" cy="432" r="9"/><text class="mt" x="860" y="436" text-anchor="middle">B</text>
    <circle class="m-load" cx="920" cy="481" r="9"/><text class="mt" x="920" y="485" text-anchor="middle">C</text>
    <circle class="m-load" cx="545" cy="575" r="9"/><text class="mt" x="545" y="579" text-anchor="middle">D</text>
    <circle class="m-load" cx="640" cy="595" r="9"/><text class="mt" x="640" y="599" text-anchor="middle">E</text>
  </g>

  <!-- Key -->
  <g>
    <path class="req" d="M40,800 H80"/>
    <text class="s" x="90" y="804">Request path (1–2)</text>
    <path class="load" d="M250,800 H290"/>
    <text class="s" x="300" y="804">Model load at pod startup (A–E)</text>
    <path class="ctl" d="M520,800 H560"/>
    <text class="s" x="570" y="804">Control plane / config</text>
    <rect class="obj" x="740" y="792" width="26" height="16" rx="3"/>
    <text class="s" x="776" y="804">Kubernetes API object</text>
  </g>
</svg>
